name: Probe push permission (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Push a throwaway branch, then delete it
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe-push-check
          git commit -q --allow-empty -m "probe: confirm the workflow token can push"
          git push -q origin probe-push-check
          echo "push succeeded"
          git push -q origin --delete probe-push-check
          echo "cleanup succeeded"
